# Alembic configuration for Shadow Agent backend.
#
# The database URL is resolved from the environment (SHADOW_AGENT_DATABASE_URL /
# SHADOW_AGENT_DATABASE_PATH) inside alembic/env.py, so this file intentionally
# does not hardcode one. Offline/online modes both reuse backend/database.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Version table lives beside app metadata; SQLAlchemy URL is injected by env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
